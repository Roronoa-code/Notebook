<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self'">
<title>Notebook</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-bin" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="M16 10l5-3v10l-5-3"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-backup" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="2"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></symbol>
  <symbol id="i-phone-off" viewBox="0 0 24 24"><path d="M8 3.5A3 3 0 0 1 9 2h6a3 3 0 0 1 3 3v9M18 18.5V19a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V6M3 3l18 18"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><circle cx="12" cy="10" r="7"/><path d="M11 8l-3 13M11.5 6.5c2.5-1 5 .5 4.5 3.5-.4 2.3-2.4 3.5-4.5 2.5"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></symbol>
  <symbol id="i-crop" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><rect x="7" y="7" width="13" height="13" rx="3"/><path d="M4 16V7a3 3 0 0 1 3-3h9"/></symbol>
</svg>

<section class="welcome" id="welcome" hidden>
  <div class="box glass">
    <h1 class="display">notebook<span style="color:var(--accent)">.</span></h1>
    <p>Pick where your notebook lives. Everything you add is copied into this folder, and your original files are never changed.</p>
    <p id="welcome-missing" class="hint" hidden></p>
    <div class="col">
      <button class="btn accent" id="w-default" type="button"></button>
      <button class="btn" id="w-choose" type="button">Choose another folder</button>
      <button class="btn" id="w-open" type="button">Open an existing library</button>
      <button class="btn" id="w-restore" type="button">Restore from a backup</button>
    </div>
  </div>
</section>

<aside class="side-nav" aria-label="Notebook">
  <div class="wordmark display">notebook<span>.</span></div>
  <div class="adds" role="toolbar" aria-label="Add">
    <button type="button" class="addtile" id="add-photos"><svg class="i"><use href="#i-photo"/></svg><span>Photos</span></button>
    <button type="button" class="addtile" id="add-videos"><svg class="i"><use href="#i-video"/></svg><span>Videos</span></button>
    <button type="button" class="addtile primary" id="new-note"><svg class="i"><use href="#i-note"/></svg><span>Note</span></button>
  </div>
  <div class="search-wrap linkwrap">
    <label for="link-input" class="sr">Save a TikTok or Pinterest link</label>
    <svg class="i"><use href="#i-link"/></svg>
    <input id="link-input" class="search" type="url" placeholder="Paste a TikTok or Pinterest link" autocomplete="off">
  </div>
  <div class="search-wrap">
    <label for="search" class="sr">Search your notebook</label>
    <svg class="i"><use href="#i-search"/></svg>
    <input id="search" class="search" type="search" placeholder="Search  (Ctrl+F)" autocomplete="off">
  </div>
  <div class="micro navlabel">Boards</div>
  <nav class="boards" id="boards" aria-label="Boards"></nav>
  <div class="suggested" id="suggested" hidden></div>
  <div class="navfoot">
    <p class="recog-status" id="recog-status" role="status" hidden></p>
    <button type="button" class="navrow" id="bin-btn" aria-pressed="false"><svg class="i"><use href="#i-bin"/></svg><span>Bin</span><span class="n" id="bin-count">0</span></button>
    <button type="button" class="navrow" id="pin-btn" aria-pressed="false"><svg class="i"><use href="#i-pin"/></svg><span>Pinterest</span></button>
    <button type="button" class="navrow" id="links-btn" aria-expanded="false"><svg class="i"><use href="#i-link"/></svg><span>Links</span><span class="n" id="links-count"></span></button>
    <button type="button" class="navrow" id="phone"><svg class="i"><use href="#i-phone"/></svg><span>Phone</span></button>
    <button type="button" class="navrow" id="lib-btn" aria-expanded="false" aria-controls="lib-pop"><svg class="i"><use href="#i-folder"/></svg><span>Library</span></button>
  </div>
</aside>

<div class="popover" id="lib-pop" hidden>
  <strong>Your library</strong>
  <div class="path" id="lib-path"></div>
  <div class="popgrid">
    <button class="btn small" type="button" id="backup"><svg class="i"><use href="#i-backup"/></svg>Back up</button>
    <button class="btn small" type="button" id="restore"><svg class="i"><use href="#i-restore"/></svg>Restore</button>
    <button class="btn small" type="button" id="export"><svg class="i"><use href="#i-export"/></svg>Export</button>
    <button class="btn small" type="button" id="lib-reveal"><svg class="i"><use href="#i-folder"/></svg>Show in File Explorer</button>
  </div>
  <label class="keep" for="auto-backup"><input type="checkbox" id="auto-backup"><span><span class="dname">Back up every week</span><span class="hint" id="auto-backup-info">Keeps the last 3 copies in a folder you choose, ideally on another drive.</span></span></label>
  <div class="poplinks"><button class="linkbtn" type="button" id="lib-quit">Quit Notebook</button><button class="linkbtn" type="button" id="lib-open">Open another library</button><button class="linkbtn" type="button" id="lib-keys">Keyboard shortcuts (?)</button></div>
</div>

<main class="page" id="page">
  <div class="context" id="context"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="grid" id="grid"></div>
  <div class="ideas" id="ideas" hidden></div>
</main>

<div class="selbar glass" id="selbar" hidden role="toolbar" aria-label="Picked items"></div>

<section class="pinpanel" id="pinpanel" hidden aria-label="Pinterest">
  <div class="pinbar">
    <button type="button" class="iconbtn" id="pin-back" aria-label="Back"><svg class="i"><use href="#i-left"/></svg></button>
    <button type="button" class="btn small" id="pin-home">Pinterest home</button>
    <span class="pinstatus" id="pinstatus" role="status"></span>
    <label class="row-switch pinai" for="pin-ai" title="Pins your PC finds to be AI-made are quietly hidden. The check happens on this PC only."><span id="pin-ai-text">Hide AI pins</span><input type="checkbox" id="pin-ai" class="switch" role="switch" checked></label>
    <button type="button" class="btn small accent" id="pin-save" disabled><svg class="i"><use href="#i-plus"/></svg>Save to library</button>
    <button type="button" class="iconbtn spin" id="pin-close" aria-label="Close Pinterest"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div class="pinhost" id="pinhost"></div>
</section>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="viewer-root"></div>
<div class="drop" id="drop" hidden></div>
<div class="tray glass" id="tray" hidden></div>

<link rel="stylesheet" href="effects.css">
<link rel="stylesheet" href="motion.css">
<script src="vendor/thinking-orbs.js"></script>
<script src="effects.js"></script>
<script src="util.js"></script>
<script src="motion.js"></script>
<script src="picker.js"></script>
<script src="viewer.js"></script>
<script src="crop.js"></script>
<script src="stacks.js"></script>
<script src="drag.js"></script>
<script src="smart.js"></script>
<script src="links.js"></script>
<script src="ideas.js"></script>
<script src="sort.js"></script>
<script src="search.js"></script>
<script src="phone.js"></script>
<script src="previews.js"></script>
<script src="shortcuts.js"></script>
<script src="app.js"></script>
</body>
</html>
